services:
  backend:
    build: .
    container_name: shopsphere-api
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - mysql

  mysql:
    image: mysql:8.0
    container_name: shopsphere-mysql
    environment:
      MYSQL_ROOT_PASSWORD: admin
      MYSQL_DATABASE: shopsphere
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: